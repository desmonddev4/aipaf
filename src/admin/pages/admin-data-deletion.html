<!--{"title":"Admin Data Deletion | AIPAF","description":"Process GDPR data deletion requests for contact messages, membership interests, and member accounts.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">GDPR compliance</p>
          <h1>Data deletion requests</h1>
          <p class="lead">Process GDPR data deletion requests for contact messages, membership interests, and member accounts.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <div class="toolbar">
              <div class="toolbar-actions">
                <div class="field"><label for="deletion-status">Status filter</label><select id="deletion-status"><option value="">All statuses</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="rejected">Rejected</option></select></div>
                <div class="field"><label for="deletion-type">Type filter</label><select id="deletion-type"><option value="">All types</option><option value="contact_message">Contact Message</option><option value="membership_interest">Membership Interest</option><option value="member_account">Member Account</option></select></div>
                <div class="field"><label for="deletion-limit">Limit</label><select id="deletion-limit"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></div>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" type="button" id="deletions-refresh">Load requests</button>
                <button class="btn btn-ghost" type="button" id="deletions-export">Export CSV</button>
                <span class="records-status" id="deletions-status" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div id="deletions-table-container" class="table-scroll"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
