<!--{"title":"Admin Members | AIPAF","description":"Manage member accounts, status, and profile information.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">Restricted area</p>
          <h1>Members</h1>
          <p class="lead">Manage member accounts, view profiles, and update member status.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <div class="toolbar">
              <div class="toolbar-actions">
                <label class="sr-only" for="admin-status">Status filter</label>
                <select id="admin-status">
                  <option value="">All statuses</option>
                  <option value="unverified">Unverified</option>
                  <option value="pending">Pending</option>
                  <option value="active">Active</option>
                  <option value="suspended">Suspended</option>
                  <option value="expired">Expired</option>
                </select>
                <label class="sr-only" for="admin-search">Search records</label>
                <input id="admin-search" type="search" placeholder="Search members">
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" type="button" id="bulk-actions" disabled>Bulk Actions</button>
                <button class="btn btn-ghost" type="button" id="admin-refresh">Refresh</button>
                <button class="btn btn-ghost" type="button" id="admin-export">Export CSV</button>
              </div>
            </div>
            <div id="admin-table-container" class="table-scroll"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
