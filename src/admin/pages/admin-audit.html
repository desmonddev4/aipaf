<!--{"title":"Admin Audit Log | AIPAF","description":"View all admin actions for security and accountability purposes.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">Security & accountability</p>
          <h1>Audit log</h1>
          <p class="lead">View all admin actions for security and accountability purposes.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <div class="toolbar">
              <div class="toolbar-actions">
                <div class="field"><label for="audit-role">Role filter</label><select id="audit-role"><option value="">All roles</option><option value="secretariat">Secretariat</option><option value="council">Council</option></select></div>
                <div class="field"><label for="audit-action">Action type</label><input id="audit-action" type="text" placeholder="Filter by action type"></div>
                <div class="field"><label for="audit-start">Start date</label><input id="audit-start" type="date"></div>
                <div class="field"><label for="audit-end">End date</label><input id="audit-end" type="date"></div>
                <div class="field"><label for="audit-limit">Limit</label><select id="audit-limit"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></div>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" type="button" id="audit-refresh">Load audit log</button>
                <button class="btn btn-ghost" type="button" id="audit-export">Export CSV</button>
                <span class="records-status" id="audit-status" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div id="audit-table-container" class="table-scroll"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
