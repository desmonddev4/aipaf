<!--{"title":"Admin Records | AIPAF","description":"Review registrations and approve or reject development activities.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">Secretariat workflow</p>
          <h1>Examination results and CPD decisions</h1>
          <p class="lead">Review registrations and approve or reject development activities.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <section class="panel records-panel" aria-labelledby="record-queue-title">
              <div class="records-grid">
                <div class="field"><label for="records-type">Record type</label><select id="records-type"><option value="examination">Examinations</option><option value="cpd">CPD</option></select></div>
                <div class="field"><label for="records-limit">Limit</label><select id="records-limit"><option value="10">10</option><option value="25">25</option><option value="100">100</option></select></div>
              </div>
              <div class="records-actions">
                <button class="btn" type="button" id="records-refresh">Load records</button>
                <span class="records-status" id="records-status" role="status" aria-live="polite"></span>
              </div>
              <div id="records-table-container" class="table-scroll"></div>
            </section>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
