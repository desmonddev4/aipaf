<!--{"title":"Admin Invitations | AIPAF","description":"Import from Schedule of Members, create manual invitations, and send invitation emails.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">Secretariat workflow</p>
          <h1>Member invitations</h1>
          <p class="lead">Import from Schedule of Members, create manual invitations, and send invitation emails.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <div class="toolbar">
              <div class="toolbar-actions">
                <div class="field"><label for="invitation-status">Status filter</label><select id="invitation-status"><option value="">All statuses</option><option value="pending">Pending</option><option value="sent">Sent</option><option value="accepted">Accepted</option><option value="declined">Declined</option><option value="expired">Expired</option></select></div>
                <div class="field"><label for="invitation-limit">Limit</label><select id="invitation-limit"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></div>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" type="button" id="invitations-refresh">Load invitations</button>
                <button class="btn btn-ghost" type="button" id="invitation-create">Create manual invitation</button>
                <span class="records-status" id="invitations-status" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div id="invitations-table-container" class="table-scroll"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
