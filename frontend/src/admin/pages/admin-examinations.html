<!--{"title":"Admin Examinations | AIPAF","description":"Create, edit, and manage examinations including scheduling and publishing.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">Examination administration</p>
          <h1>Examination management</h1>
          <p class="lead">Create, edit, and manage examinations including scheduling and publishing.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <div class="toolbar">
              <div class="toolbar-actions">
                <div class="field"><label for="exam-status">Status filter</label><select id="exam-status"><option value="">All statuses</option><option value="draft">Draft</option><option value="open">Open</option><option value="closed">Closed</option><option value="archived">Archived</option></select></div>
                <div class="field"><label for="exam-limit">Limit</label><select id="exam-limit"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></div>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" type="button" id="exams-refresh">Load examinations</button>
                <button class="btn btn-ghost" type="button" id="exam-create">Create examination</button>
                <span class="records-status" id="exams-status" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div id="exams-table-container" class="table-scroll"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
