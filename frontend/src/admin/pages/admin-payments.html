<!--{"title":"Admin Payments | AIPAF","description":"View, filter, and manage payment records including status updates and refunds.","nav":"admin","noindex":true}-->
<div class="admin">
  <main class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-content">
      <header class="band">
        <div class="wrap">
          <p class="eyebrow">Financial management</p>
          <h1>Payment management</h1>
          <p class="lead">View, filter, and manage payment records including status updates and refunds.</p>
        </div>
      </header>

      <div class="shell">
        <div class="wrap pull">
          <section class="dashboard is-open" id="admin-dashboard" aria-label="Admin dashboard">
            <div class="toolbar">
              <div class="toolbar-actions">
                <div class="field"><label for="payment-status">Status filter</label><select id="payment-status"><option value="">All statuses</option><option value="pending">Pending</option><option value="authorized">Authorized</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="refunded">Refunded</option><option value="cancelled">Cancelled</option></select></div>
                <div class="field"><label for="payment-purpose">Purpose filter</label><select id="payment-purpose"><option value="">All purposes</option><option value="membership">Membership</option><option value="examination">Examination</option><option value="subscription">Subscription</option><option value="other">Other</option></select></div>
                <div class="field"><label for="payment-provider">Provider filter</label><select id="payment-provider"><option value="">All providers</option><option value="manual">Manual</option><option value="paystack">Paystack</option><option value="flutterwave">Flutterwave</option></select></div>
                <div class="field"><label for="payment-limit">Limit</label><select id="payment-limit"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></div>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" type="button" id="payments-refresh">Load payments</button>
                <button class="btn btn-ghost" type="button" id="payments-export">Export CSV</button>
                <span class="records-status" id="payments-status" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div id="payments-table-container" class="table-scroll"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/admin/index.js"></script>
