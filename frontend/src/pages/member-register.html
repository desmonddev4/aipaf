<!--{"title":"Member registration | AIPAF","description":"Create an AIPAF member account.","nav":"members"}-->
<style>
  .member-page { min-height: calc(100vh - 72px); background: #f3f7f4; color: #172d25; }
  .member-page .wrap { width: min(760px, calc(100% - 2rem)); margin-inline: auto; }
  .member-page .shell { padding: clamp(3rem, 7vw, 6rem) 0; }
  .member-form { padding: clamp(1.5rem, 5vw, 3rem); background: #fff; border: 1px solid rgba(15,92,63,.12); border-radius: 24px; box-shadow: 0 30px 60px -38px rgba(10,40,28,.45); }
  .member-page h1 { margin: 0 0 .5rem; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.3rem, 7vw, 4.5rem); line-height: 1; }
  .member-page .lead { margin: 0 0 2rem; color: #46574f; }
  .field-grid { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field { margin-bottom: 1rem; }
  .field-full { grid-column: 1 / -1; }
  label { display: block; margin-bottom: .45rem; font-weight: 600; }
  input, select { width: 100%; padding: .8rem 1rem; border: 1.5px solid rgba(16,35,28,.15); border-radius: 12px; font: inherit; }
  input:focus, select:focus { outline: none; border-color: #0f5c3f; box-shadow: 0 0 0 4px rgba(15,92,63,.12); }
  .field-note { margin: .4rem 0 0; font-size: .85rem; color: #46574f; }
  .btn { display: inline-flex; min-height: 3rem; padding: .8rem 1.5rem; border: 0; border-radius: 999px; background: #0f5c3f; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .btn[disabled] { cursor: progress; opacity: .7; }
  .form-status { min-height: 1.5rem; margin: 1rem 0 0; color: #b3261e; }
  .form-status.ok { color: #12704a; }
  .meta { margin-top: 1.5rem; color: #46574f; font-size: .95rem; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
</style>
<div class="member-page">
  <main class="shell">
    <div class="wrap">
      <h1>Create your account.</h1>
      <p class="lead">Register for secure member access to AIPAF services.</p>
      <form class="member-form" id="member-register-form" novalidate>
        <div class="field-grid">
          <div class="field"><label for="first-name">First name</label><input id="first-name" name="firstName" required maxlength="100"></div>
          <div class="field"><label for="last-name">Last name</label><input id="last-name" name="lastName" required maxlength="100"></div>
          <div class="field field-full"><label for="member-email">Email</label><input id="member-email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
          <div class="field field-full"><label for="member-password">Password</label><input id="member-password" name="password" type="password" autocomplete="new-password" required minlength="12"></div>
          <div class="field"><label for="member-country">Country</label><input id="member-country" name="country" maxlength="80"></div>
          <div class="field"><label for="member-organisation">Organisation</label><input id="member-organisation" name="organisation" maxlength="150"></div>
          <div class="field field-full"><label for="member-designation">Designation</label><input id="member-designation" name="designation" maxlength="150"></div>
        </div>
        <button class="btn" type="submit">Create account</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="meta">Already have an account? <a href="/member-login">Sign in</a>.</p>
        <p class="meta">Need to recover access? <a href="/member-forgot-password">Reset password</a>.</p>
      </form>
    </div>
  </main>
</div>
<script>
(function () {
  var form = document.querySelector('#member-register-form');
  var status = form.querySelector('.form-status');
  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    status.className = 'form-status';
    status.textContent = '';
    var data = Object.fromEntries(new FormData(form).entries());
    form.querySelector('button').disabled = true;
    try {
      var response = await window.apiFetch('/api/members', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action: 'register' }, data)) });
      var payload = await window.readApiJson(response);
      if (!response.ok) throw new Error(payload.message || 'Unable to create the account.');
      status.classList.add('ok');
      status.textContent = 'Account created. Please sign in.';
      form.reset();
      setTimeout(function () { window.location.href = '/member-login'; }, 1200);
    } catch (error) {
      status.textContent = error.message;
    } finally {
      form.querySelector('button').disabled = false;
    }
  });
})();
</script>
