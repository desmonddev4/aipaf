<style>

.mp input:not([type]),.mp input[type="password"],.mp input[type="text"],.mp input[type="email"]{width: 100%; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: .9rem;

.mp .ai-card:has(.ai-grid:not([hidden])){width: min(100%, 60rem);}
@media (min-width: 52rem) {.mp .ai-grid:not([hidden]){display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem; align-items: start;} .mp .ai-grid .lead{margin-bottom: 1.2rem;} .mp .ai-grid .ai-details{margin-bottom: 0;} .mp .ai-grid form{padding: 1.4rem; border: 1px solid var(--line); border-radius: 1.2rem; background: rgba(0, 12, 6, .25);} .mp .ai-grid .ai-check{margin: .8rem 0 1rem;} .mp .ai-grid .form-status{margin-top: .6rem; min-height: 1.2rem;}}
.mp .ai-grid .meta{margin-bottom: 1.4rem;}
@media (min-width: 52rem) {.mp .ai-grid .meta{margin-bottom: 0;}}
.mp .ai-scroll{white-space: nowrap; position: fixed; left: 50%; bottom: 1rem; z-index: 5; transform: translateX(-50%); display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(10, 44, 22, .9); color: #fff; font-size: .85rem; font-weight: 700; cursor: pointer; box-shadow: 0 .8rem 1.6rem -.8rem #000; animation: bob 1.4s ease-in-out infinite;}
50% { transform: translate(-50%, 4px); }
.mp .ai-hint{margin-top: .35rem; color: var(--mute); font-size: .8rem;}
.mp .ai-check{display: flex; align-items: flex-start; gap: .7rem; margin: 1.2rem 0; color: var(--mute); font-size: .92rem;}
.mp .ai-check input{flex: none; width: 1.15rem; height: 1.15rem; margin-top: .2rem; accent-color: var(--gold);}
.mp .btn{display: inline-flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; padding: .9rem 1.2rem; border: 0; border-radius: 999px;
  background: linear-gradient(135deg, #f2ac1f, #d28503); color: #2c1b00; font-weight: 700; cursor: pointer;
  box-shadow: 0 .8rem 1.8rem -1rem rgba(242, 172, 31, .9), inset 0 1px 0 rgba(255, 255, 255, .4);
  transition: transform .2s, filter .2s;}
.mp .btn:hover{transform: translateY(-2px); filter: brightness(1.08);}
.mp .btn:focus-visible{outline: 3px solid #fff; outline-offset: 3px;}
.mp .btn[disabled]{opacity: .6; cursor: progress; transform: none;}
.mp .btn-ghost{background: rgba(255, 255, 255, .1); color: #fff; border: 1px solid var(--line); box-shadow: none; text-decoration: none;}
.mp .form-status{min-height: 1.4rem; margin-top: 1rem; color: #ffaaa2; font-size: .92rem;}
.mp .form-status.ok{color: #7be3a0;}
.mp .form-status.loading{color: var(--mute);}
.mp .meta{margin-top: 1.4rem; color: var(--mute); font-size: .85rem;}
.mp .ai-state{display: grid; justify-items: center; gap: 1rem; padding: 1.5rem 0 .5rem; text-align: center;}
.mp .ai-state .ico{display: grid; place-items: center; width: 4rem; height: 4rem; border-radius: 50%; background: rgba(255, 138, 128, .15); color: #ffaaa2;}
.mp .ai-state.ok .ico{background: rgba(63, 191, 107, .18); color: #7be3a0;}
.mp .spinner{width: 2.2rem; height: 2.2rem; border: 3px solid rgba(255, 255, 255, .2); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite;}
to { transform: rotate(360deg); }
from { opacity: 0; transform: translateY(1.2rem); }
to { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {.mp *,.mp *::before,.mp *::after{animation: none !important; transition: none !important;}}
.mp .ai-links{display: grid; gap: .5rem; margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid rgba(255,255,255,.12); color: var(--mute); font-size: .9rem;}
.mp .ai-links a{font-weight: 600; text-decoration: none;}
.mp .ai-links a:hover{text-decoration: underline;}
.mp .btn .spinner{width: 1rem; height: 1rem; border-width: 2px;}
@media (max-width: 52rem) {}
.mp .mp-main{width: min(100%, 68rem); margin: 0 auto; padding: clamp(1rem, 4vw, 2.5rem); display: grid; gap: 1.25rem;}
.mp .card{padding: clamp(1.2rem, 3.5vw, 2rem); border: 1px solid var(--line); border-radius: 1.4rem; background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.04)); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 1.5rem 4rem -2rem rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.16); scroll-margin-top: 9rem;}
.mp .card > h2{font: 500 1.5rem var(--serif); margin-bottom: .3rem;}
.mp .card > .sub{margin-bottom: 1.1rem; color: var(--mute); font-size: .92rem;}
.mp .mp-actions{display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; grid-column: 1 / -1;}
.mp .mp-actions .btn{width: auto; padding: .65rem 1.2rem; font-size: .9rem;}
.mp .btn.secondary{background: rgba(255,255,255,.1); color: #fff; border: 1px solid var(--line); box-shadow: none;}
.mp .btn.small{width: auto; padding: .5rem 1rem; font-size: .85rem;}
.mp .field-grid{display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 1rem;}
.mp .field-full{grid-column: 1 / -1;}
@media (max-width: 40rem) {.mp .field-grid{grid-template-columns: 1fr;} .mp .mp-hero{grid-template-columns: 1fr;}}
.mp input:not([type]),.mp input[type="email"],.mp input[type="tel"],.mp input[type="url"],.mp input[type="number"],.mp input[type="date"],.mp select,.mp textarea{width: 100%; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: .9rem; background: rgba(0,12,6,.45); color: #fff; transition: border-color .2s, box-shadow .2s;}
.mp select option{color: #111;}
.mp textarea{resize: vertical; font: inherit;}
.mp input[type="date"]{color-scheme: dark;}
.mp .card .btn[type="submit"]{width: auto; padding: .8rem 1.6rem;}
.mp .record-list{display: grid; gap: .7rem; margin-top: 1rem;}
.mp .record-item{padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: 1rem; background: rgba(255,255,255,.06);}
.mp .record-item strong{display: block;}
.mp .record-item p{margin: .2rem 0 .1rem; color: var(--mute); font-size: .88rem;}
.mp .record-item .btn{margin-top: .6rem;}
.mp .empty{color: var(--mute);}
.mp .meta{color: var(--mute); font-size: .88rem;}
.mp .login-required{max-width: 28rem; margin: 20vh auto; text-align: center;}
.mp .login-required .btn{width: auto; margin-top: 1rem; text-decoration: none;}
.mp{min-height:70vh;color:#fff;font-family:var(--sans);line-height:1.5;padding:clamp(5.5rem,10vw,7rem) 0 3rem;background:radial-gradient(ellipse at 75% 5%,rgba(210,133,3,.2),transparent 38rem),radial-gradient(ellipse at 8% 100%,rgba(11,107,43,.32),transparent 32rem),linear-gradient(145deg,#03140a,#0a2c16 58%,#061f10);}
.mp .card{scroll-margin-top:7rem;}
.mp .page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:.8rem;margin:0 .25rem .2rem;}
.mp .page-head h1{font:500 clamp(1.9rem,5vw,2.8rem)/1.05 var(--serif);}
.mp .page-head p{color:var(--mute);margin-top:.35rem;}
.mp .who{padding:.35rem .9rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);color:var(--mute);font-size:.82rem;}
.mp .two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:1.25rem;align-items:start;}
@media (max-width:56rem){.mp .two{grid-template-columns:1fr;}}

<div class="mp">
<div id="page-gate" class="login-required card"><h2>Loading your portal...</h2><p class="meta">If this takes long, you may need to sign in.</p><a class="btn" href="/member-login">Sign in</a></div>
<div class="mp-main" id="page-content" hidden>
  <div class="page-head"><div><h1>Examinations</h1><p>Open assessments you can register for.</p></div><span class="who" id="who"></span></div>
<section class="card"><h2>Open examinations</h2><p class="sub">Register for an assessment.</p>
    <div id="examination-list" class="record-list"></div>
    <p class="form-status" id="examination-status" role="status" aria-live="polite"></p></section>
</div>
</div>
<script src="/js/member.js"></script>
<script>
(async function () {
  var member = await window.Member.requireAuth();
  document.querySelector("#who").textContent = member.email;

  var list = document.querySelector('#examination-list');
  var status = document.querySelector('#examination-status');
  async function load() {
    try {
      var payload = await window.Member.json(await window.apiFetch('/api/member-records?action=examinations'), 'Unable to load examinations.');
      var open = (payload.items || []).filter(function (i) { return i.status === 'open'; });
      if (!open.length) { window.Member.renderRecords([], list, 'No open examinations are available at the moment.'); return; }
      list.innerHTML = '';
      open.forEach(function (exam) {
        var row = document.createElement('article'); row.className = 'record-item';
        var t = document.createElement('strong'); t.textContent = exam.name;
        var d = document.createElement('p'); d.textContent = exam.code + ' • Opens ' + (exam.opens_at || 'immediately') + ' • Closes ' + (exam.closes_at || 'not specified');
        var b = document.createElement('button'); b.type = 'button'; b.className = 'btn secondary small'; b.textContent = 'Register';
        b.addEventListener('click', async function () {
          status.className = 'form-status'; status.textContent = 'Registering...'; b.disabled = true;
          try {
            await window.Member.json(await window.Member.post('/api/member-records?action=register-examination', { examinationId: exam.id }), 'Unable to register for this examination.');
            status.className = 'form-status ok'; status.textContent = 'Registration submitted.';
          } catch (e) { status.textContent = e.message; }
          b.disabled = false;
        });
        row.appendChild(t); row.appendChild(d); row.appendChild(b); list.appendChild(row);
      });
    } catch (e) { status.textContent = e.message; }
  }
  load();
})();
</script>
