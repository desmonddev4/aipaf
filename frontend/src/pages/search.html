<!--{"title":"Search | AIPAF","description":"Search AIPAF's public information on membership, credentials, project certification, governance, and more.","nav":"search","noindex":true}-->
<style>
  .site-search { color: var(--text); }
  .site-search .search-hero { padding: clamp(8rem, 15vh, 10rem) 0 3.5rem; color: #fff; background: linear-gradient(125deg, #062c15, #0b5428 62%, #07371b); }
  .site-search .search-wrap { width: min(980px, 100% - 2.5rem); margin-inline: auto; }
  .site-search .eyebrow { color: var(--gold-hi); }
  .site-search h1 { max-width: 16ch; margin: 0 0 .8rem; color: #fff; font-size: clamp(2.4rem, 5vw, 4rem); }
  .site-search .search-lead { max-width: 42rem; color: rgba(255,255,255,.82); font-size: 1.08rem; }
  .site-search .search-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .65rem; margin-top: 1.75rem; }
  .site-search input { width: 100%; min-width: 0; min-height: 3.5rem; padding: .85rem 1rem; border: 1px solid rgba(255,255,255,.48); border-radius: 8px; background: #fff; color: var(--text); font: inherit; }
  .site-search input:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
  .site-search .search-submit { min-height: 3.5rem; padding: .8rem 1.5rem; border: 0; border-radius: 8px; background: var(--gold-hi); color: var(--g950); font: 700 1rem var(--sans); cursor: pointer; }
  .site-search .search-submit:hover { background: var(--gold-soft); }
  .site-search .search-body { min-height: 22rem; padding: 2.5rem 0 5rem; background: var(--g50); }
  .site-search .search-heading { margin: 0 0 1rem; color: var(--g900); font-size: 1.45rem; }
  .site-search .popular-links { display: flex; flex-wrap: wrap; gap: .65rem; }
  .site-search .popular-links a { display: inline-flex; align-items: center; min-height: 2.6rem; padding: .55rem .9rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--g800); font-weight: 600; text-decoration: none; }
  .site-search .popular-links a:hover { border-color: var(--g800); background: var(--g100); }
  .site-search .search-status { min-height: 1.5rem; margin: 0 0 .5rem; color: var(--muted); }
  .site-search .search-results { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .site-search .search-results li { padding: 1.15rem 0; border-bottom: 1px solid var(--line); }
  .site-search .search-results a { color: var(--g800); font: 600 1.25rem/1.3 var(--serif); text-decoration: none; }
  .site-search .search-results a:hover { text-decoration: underline; text-underline-offset: .2em; }
  .site-search .search-results p { margin: .35rem 0 0; color: var(--muted); }
  @media (max-width: 560px) {
    .site-search .search-wrap { width: min(100% - 2rem, 40rem); }
    .site-search .search-form { grid-template-columns: 1fr; }
    .site-search .search-submit { width: 100%; }
  }
</style>

<div class="site-search">
  <section class="search-hero" aria-labelledby="search-title">
    <div class="search-wrap">
      <p class="eyebrow">AIPAF resources</p>
      <h1 id="search-title">Search the Institute</h1>
      <p class="search-lead">Find public information on professional credentials, membership, project certification, and the Institute.</p>
      <form class="search-form" id="site-search-form" action="/search" method="get" role="search">
        <label class="visually-hidden" for="site-search-query">Search public pages</label>
        <input id="site-search-query" name="q" type="search" autocomplete="off" placeholder="Search AIPAF" value="">
        <button class="search-submit" type="submit">Search</button>
      </form>
    </div>
  </section>
  <section class="search-body" aria-labelledby="search-results-title">
    <div class="search-wrap">
      <h2 class="search-heading" id="search-results-title">Popular pages</h2>
      <div class="popular-links" id="popular-links">
        <a href="/membership">Membership</a>
        <a href="/credentials">Credentials</a>
        <a href="/project-certification">Project certification</a>
        <a href="/governance">Governance</a>
        <a href="/certificate-verification">Certificate verification</a>
      </div>
      <p class="search-status" id="search-status" role="status" aria-live="polite" hidden></p>
      <ol class="search-results" id="search-results" aria-label="Search results" hidden></ol>
    </div>
  </section>
</div>

<script>
(function () {
  var form = document.getElementById('site-search-form');
  var input = document.getElementById('site-search-query');
  var heading = document.getElementById('search-results-title');
  var popular = document.getElementById('popular-links');
  var status = document.getElementById('search-status');
  var results = document.getElementById('search-results');
  var pagePaths = ['/', '/about', '/lifecycle', '/membership', '/credentials', '/project-certification', '/governance', '/member-directory', '/certificate-verification', '/contact', '/privacy'];
  var indexPromise;
  var timer;

  function loadIndex() {
    if (!indexPromise) {
      indexPromise = Promise.all(pagePaths.map(async function (path) {
        var response = await fetch(path);
        if (!response.ok) return null;
        var html = await response.text();
        var page = new DOMParser().parseFromString(html, 'text/html');
        var main = page.querySelector('main');
        if (!main) return null;
        var description = page.querySelector('meta[name="description"]');
        return {
          url: path,
          title: (main.querySelector('h1') || page.querySelector('title')).textContent.trim(),
          summary: description ? description.content : '',
          body: main.innerText || main.textContent
        };
      })).then(function (pages) { return pages.filter(Boolean); });
    }
    return indexPromise;
  }

  function render(pages, query) {
    var terms = query.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
    results.replaceChildren();
    if (!terms.length) {
      popular.hidden = false;
      results.hidden = true;
      status.hidden = true;
      heading.textContent = 'Popular pages';
      return;
    }
    var matches = pages.map(function (page) {
      var content = (page.title + ' ' + page.summary + ' ' + page.body).toLocaleLowerCase();
      var score = terms.reduce(function (total, term) {
        if (!content.includes(term)) return -1;
        return total + (page.title.toLocaleLowerCase().includes(term) ? 4 : 1);
      }, 0);
      return { page: page, score: score };
    }).filter(function (item) { return item.score >= 0; })
      .sort(function (a, b) { return b.score - a.score; });

    popular.hidden = true;
    results.hidden = false;
    status.hidden = false;
    heading.textContent = 'Search results';
    status.textContent = matches.length + (matches.length === 1 ? ' result' : ' results');
    matches.forEach(function (item) {
      var entry = document.createElement('li');
      var link = document.createElement('a');
      var summary = document.createElement('p');
      link.href = item.page.url;
      link.textContent = item.page.title;
      summary.textContent = item.page.summary;
      entry.append(link, summary);
      results.append(entry);
    });
    if (!matches.length) status.textContent = 'No results found.';
  }

  async function search(query) {
    var value = query.trim();
    if (!value) { render([], ''); return; }
    popular.hidden = true;
    results.hidden = true;
    status.hidden = false;
    status.textContent = 'Searching…';
    heading.textContent = 'Search results';
    try {
      render(await loadIndex(), value);
    } catch (error) {
      status.textContent = 'Search is temporarily unavailable.';
    }
  }

  input.value = new URLSearchParams(window.location.search).get('q') || '';
  input.addEventListener('input', function () {
    window.clearTimeout(timer);
    timer = window.setTimeout(function () {
      var query = input.value.trim();
      var url = new URL(window.location.href);
      if (query) url.searchParams.set('q', query);
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', url);
      search(query);
    }, 120);
  });
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    window.clearTimeout(timer);
    var query = input.value.trim();
    var url = new URL(window.location.href);
    if (query) url.searchParams.set('q', query);
    else url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
    search(query);
  });
  if (input.value.trim()) search(input.value.trim());
})();
</script>
