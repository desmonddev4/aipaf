<!--{"title":"Reset password | AIPAF","description":"Set a new password for your AIPAF member account.","nav":"members","noindex":true}-->
<style>
  .member-page { min-height: calc(100vh - 72px); background: #f3f7f4; color: #172d25; }
  .member-page .wrap { width: min(520px, calc(100% - 2rem)); margin-inline: auto; }
  .member-page .shell { padding: clamp(3rem, 7vw, 6rem) 0; }
  .member-form { padding: clamp(1.5rem, 5vw, 2.5rem); background: #fff; border: 1px solid rgba(15,92,63,.12); border-radius: 24px; box-shadow: 0 30px 60px -38px rgba(10,40,28,.45); }
  .member-page h1 { margin: 0 0 .5rem; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.1rem, 7vw, 3.6rem); line-height: 1; }
  .member-page .lead { margin: 0 0 2rem; color: #46574f; }
  .field { margin-bottom: 1rem; }
  label { display: block; margin-bottom: .45rem; font-weight: 600; }
  input { width: 100%; padding: .8rem 1rem; border: 1.5px solid rgba(16,35,28,.15); border-radius: 12px; font: inherit; }
  input:focus { outline: none; border-color: #0f5c3f; box-shadow: 0 0 0 4px rgba(15,92,63,.12); }
  .btn { display: inline-flex; min-height: 3rem; padding: .8rem 1.5rem; border: 0; border-radius: 999px; background: #0f5c3f; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .btn[disabled] { cursor: progress; opacity: .7; }
  .form-status { min-height: 1.5rem; margin: 1rem 0 0; color: #b3261e; }
  .form-status.ok { color: #12704a; }
  .meta { margin-top: 1.5rem; color: #46574f; font-size: .95rem; }
</style>
<div class="member-page">
  <main class="shell">
    <div class="wrap">
      <h1>Set your new password.</h1>
      <p class="lead">Enter a secure password for your account.</p>
      <form class="member-form" id="password-reset-form" novalidate>
        <div class="field"><label for="new-password">New password</label><input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="12"></div>
        <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12"></div>
        <button class="btn" type="submit">Reset password</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="meta"><a href="/member-login">Back to sign in</a></p>
      </form>
    </div>
  </main>
</div>
<script type="module">
import { readApiJson } from '/js/api.js';

(function () {
  var form = document.querySelector('#password-reset-form');
  var status = form.querySelector('.form-status');
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  if (!token) {
    status.textContent = 'Invalid or missing reset token. Please request a new password reset.';
    form.querySelector('button').disabled = true;
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    status.className = 'form-status';
    status.textContent = '';

    var newPassword = form.querySelector('#new-password').value;
    var confirmPassword = form.querySelector('#confirm-password').value;

    if (!newPassword || newPassword.length < 12) {
      status.textContent = 'Password must be at least 12 characters.';
      return;
    }

    if (newPassword !== confirmPassword) {
      status.textContent = 'Passwords do not match.';
      return;
    }

    form.querySelector('button').disabled = true;
    try {
      var response = await fetch('/api/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'reset-password', token: token, newPassword: newPassword })
      });
      var payload = await readApiJson(response);
      if (!response.ok) throw new Error(payload.message || 'Unable to reset password.');
      status.classList.add('ok');
      status.textContent = payload.message || 'Password reset successfully. Redirecting to login...';
      setTimeout(function () { window.location.href = '/member-login'; }, 2000);
    } catch (error) {
      status.textContent = error.message;
    } finally {
      form.querySelector('button').disabled = false;
    }
  });
})();
</script>
