# Render Blueprint for AIPAF Website
# This blueprint deploys the web service only (database already exists)

services:
  # Web Service
  - type: web
    name: aipaf-website
    env: node
    plan: free
    rootDir: aipaf-website
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: info@aipafgh.org
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: AIPAF Website <info@aipafgh.org>
      - key: SECRETARIAT_EMAIL
        value: info@aipafgh.org
      - key: ADMIN_SECRETARIAT_KEY
        sync: false
      - key: ADMIN_COUNCIL_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: CERTIFICATE_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
