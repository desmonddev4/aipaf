# Render Blueprint for AIPAF Website
# This blueprint creates both the web service and PostgreSQL database

services:
  # PostgreSQL Database
  - type: pserv
    name: aipaf-database
    plan: free
    databaseName: aipaf
    user: aipaf_user

  # Web Service
  - type: web
    name: aipaf-website
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        fromDatabase:
          name: aipaf-database
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECRETARIAT_EMAIL
        sync: false
      - key: ADMIN_SECRETARIAT_KEY
        sync: false
      - key: ADMIN_COUNCIL_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: CERTIFICATE_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
