# Render Blueprint for AIPAF Backend API
# This blueprint deploys the backend API and database (frontend is on Vercel)

services:
  # PostgreSQL Database
  - type: postgres
    name: aipaf-database
    plan: free
    databaseName: aipaf

  # Web Service (API-only backend)
  - type: web
    name: aipaf-backend
    env: node
    plan: free
    rootDir: aipaf-website
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: aipaf-database
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
        # Set to your Vercel domain (e.g., https://aipafgh.org) for CORS security
        # Set to '*' during development if needed
      - key: SESSION_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: info@aipafgh.org
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: AIPAF Website <info@aipafgh.org>
      - key: SECRETARIAT_EMAIL
        value: info@aipafgh.org
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: CERTIFICATE_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
